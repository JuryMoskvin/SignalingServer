# coturn config for the WebRTC video-call app's TURN relay.
# STUN alone can't traverse symmetric NATs / restrictive firewalls — this is
# the fallback relay for calls between peers on incompatible networks
# (different ISPs, mobile carriers, etc.), which is exactly the failure mode
# that "app closes the room" turned out to be.

listening-port=3478

# Relay port range — must match the Docker port mapping and the VPS firewall
# rule below. 200 ports is plenty for a handful of concurrent relayed calls
# (each call uses at most a couple of ports).
min-port=49160
max-port=49200

# Long-term credential mechanism: fixed username/password, set below.
lt-cred-mech
user=webrtcuser:REPLACE_WITH_GENERATED_PASSWORD
realm=workoutgeneratorservice.kz

fingerprint
no-multicast-peers
no-cli

# Plain TURN only for now (no turns:// / DTLS) — adding that later needs a
# cert and a separate TLS listening port; not required to fix NAT traversal.
no-tls
no-dtls

log-file=stdout
